<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f4" />
    <title>Items | codex_pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --ink: #232827;
        --muted: #626b68;
        --line: #dce1dd;
        --accent: #146b58;
        --danger: #b53636;
      }
      * { box-sizing: border-box; letter-spacing: 0; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        color: var(--ink);
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        background: repeating-linear-gradient(90deg, transparent 0 95px, #23282703 95px 96px), #f5f6f4;
      }
      main { max-width: 840px; margin: 48px auto; padding: 0 28px; }
      header { display: flex; align-items: center; gap: 16px; padding-bottom: 28px; }
      .brand-mark { display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--accent); }
      .brand-mark svg { width: 26px; height: 26px; }
      .workspace-label { color: var(--muted); font-size: 12px; font-weight: 500; }
      h1 { margin: 0; font-size: 32px; line-height: 1.2; font-weight: 600; }
      h2 { margin: 0; font-size: 17px; font-weight: 600; }
      label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
      .composer { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 24px 0; }
      .input-row { display: flex; align-items: stretch; gap: 10px; }
      input, button { font: inherit; }
      input {
        min-width: 0;
        width: 100%;
        min-height: 46px;
        padding: 10px 14px;
        color: var(--ink);
        background: #fff;
        border: 1px solid #c6cfca;
        border-radius: 6px;
      }
      input::placeholder { color: #717975; }
      input:focus-visible, button:focus-visible { outline: 3px solid #79bca8; outline-offset: 3px; }
      button { cursor: pointer; }
      button:disabled { cursor: wait; opacity: .5; }
      .primary-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        gap: 8px;
        min-height: 46px;
        padding: 10px 18px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
      }
      .primary-button:hover:not(:disabled) { background: #105443; }
      .primary-button svg, .icon-button svg { width: 18px; height: 18px; flex-shrink: 0; }
      .list-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 0 16px; }
      .list-heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
      #item-count { min-width: 76px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
      .list-tools { display: flex; align-items: center; gap: 8px; }
      .search-field { position: relative; display: flex; align-items: center; width: 260px; max-width: 100%; }
      .search-field > svg { position: absolute; left: 12px; width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
      .search-field input { padding-left: 38px; padding-right: 44px; font-size: 14px; }
      .search-field input::-webkit-search-cancel-button { display: none; }
      #clear-search { position: absolute; right: 2px; }
      .icon-button {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
      }
      .icon-button:hover:not(:disabled) { color: var(--accent); background: #e3ede8; }
      .icon-button.danger:hover:not(:disabled) { color: var(--danger); background: #fbe7e5; }
      .icon-button[data-tooltip]::after {
        position: absolute;
        z-index: 2;
        right: 0;
        bottom: calc(100% + 6px);
        width: max-content;
        max-width: 180px;
        padding: 5px 8px;
        border-radius: 4px;
        background: var(--ink);
        color: #fff;
        content: attr(data-tooltip);
        font-size: 12px;
        font-weight: 400;
        pointer-events: none;
        visibility: hidden;
      }
      .icon-button[data-tooltip]:is(:hover, :focus-visible)::after { visibility: visible; }
      #item-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
      .item-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 72px; padding: 12px 0; border-bottom: 1px solid var(--line); animation: appear .18s ease-out; }
      .item-marker { display: grid; place-items: center; color: #7b8580; }
      .item-marker svg { width: 20px; height: 20px; }
      .item-text { overflow-wrap: anywhere; }
      .item-actions { display: flex; gap: 2px; }
      #list-state { display: grid; justify-items: center; gap: 12px; padding: 56px 16px; border-top: 1px solid var(--line); color: var(--muted); text-align: center; }
      #list-state svg { width: 32px; height: 32px; color: #83958b; }
      #state-text { margin: 0; font-size: 14px; }
      #feedback { margin: 0 0 16px; padding: 12px 14px; border-left: 3px solid var(--danger); background: #fceceb; color: #8b2929; font-size: 14px; overflow-wrap: anywhere; }
      #activity { display: block; min-height: 24px; margin: 16px 0 0; color: var(--accent); font-size: 13px; }
      .is-loading svg { animation: spin 1s linear infinite; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes appear { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 560px) {
        main { margin: 28px auto; padding: 0 18px; }
        h1 { font-size: 28px; }
        .list-tools { width: 100%; }
        .search-field { flex: 1; width: auto; }
        .primary-button { padding: 10px 12px; }
        .item-row { grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand-mark" aria-hidden="true"><i data-lucide="layers"></i></div>
        <div>
          <div class="workspace-label">codex_pro</div>
          <h1>Items</h1>
        </div>
      </header>
      <form id="item-form" class="composer">
        <label for="item-text">New item</label>
        <div class="input-row">
          <input id="item-text" type="text" placeholder="Item name" autocomplete="off" required />
          <button class="primary-button" type="submit"><i data-lucide="plus" aria-hidden="true"></i>Add item</button>
        </div>
      </form>
      <section aria-labelledby="collection-title">
        <div class="list-toolbar">
          <div class="list-heading">
            <h2 id="collection-title">All items</h2>
            <output id="item-count"></output>
          </div>
          <div class="list-tools">
            <div class="search-field" role="search">
              <label for="search-items" class="sr-only">Search items</label>
              <i data-lucide="search" aria-hidden="true"></i>
              <input id="search-items" type="search" placeholder="Search items" autocomplete="off" />
              <button id="clear-search" class="icon-button" type="button" aria-label="Clear search" data-tooltip="Clear search" hidden><i data-lucide="x" aria-hidden="true"></i></button>
            </div>
            <button id="refresh-items" class="icon-button" type="button" aria-label="Refresh items" data-tooltip="Refresh items"><i data-lucide="refresh-cw" aria-hidden="true"></i></button>
          </div>
        </div>
        <p id="feedback" role="alert" hidden></p>
        <ul id="item-list" aria-label="Items"></ul>
        <output id="list-state" hidden>
          <i data-lucide="inbox" aria-hidden="true"></i>
          <span id="state-text"></span>
        </output>
        <output id="activity"></output>
      </section>
    </main>
    <script src="node_modules/lucide/dist/umd/lucide.min.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
